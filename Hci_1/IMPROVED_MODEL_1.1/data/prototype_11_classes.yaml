# DEPRECATED — use data/prototype_7_classes.yaml (7-class locked training config)
# Legacy 11-class mixed plan — not used in active pipeline

schema_version: "1.0"
phase: prototype_11
task: mixed  # segmentation (7) + detection (4)

# YOLO training uses contiguous prototype IDs 0–10 (nc: 11)
nc: 11

path: D:/HCI_interor/IMPROVED_MODEL_1/data/prototype_dataset
train: images/train
val: images/val

names:
  0: wall
  1: door
  2: window
  3: bedroom
  4: living_room
  5: kitchen
  6: bathroom
  7: bed
  8: wc
  9: sink
  10: stove

# Map prototype ID → production taxonomy ID (data/classes.yaml, 37-class schema)
production_id_map:
  0: 0    # wall
  1: 1    # door
  2: 2    # window
  3: 5    # bedroom
  4: 7    # living_room
  5: 9    # kitchen
  6: 10   # bathroom
  7: 15   # bed
  8: 27   # wc
  9: 31   # sink
  10: 32  # stove

groups:
  structural:
    prototype_ids: [0, 1, 2]
    annotation_type: polygon
  rooms:
    prototype_ids: [3, 4, 5, 6]
    annotation_type: polygon
  symbols:
    prototype_ids: [7, 8, 9, 10]
    annotation_type: bounding_box

# Per-class definition for CVAT / annotators
classes:
  - prototype_id: 0
    name: wall
    group: structural
    production_id: 0
    annotation_type: polygon
    cvat_color: "#FF0000"
    dataset_support: "100%"
    annotate_on: all_images
  - prototype_id: 1
    name: door
    group: structural
    production_id: 1
    annotation_type: polygon
    cvat_color: "#00CC00"
    dataset_support: "100%"
    annotate_on: all_images
  - prototype_id: 2
    name: window
    group: structural
    production_id: 2
    annotation_type: polygon
    cvat_color: "#0066FF"
    dataset_support: "99.7%"
    annotate_on: all_images
  - prototype_id: 3
    name: bedroom
    group: rooms
    production_id: 5
    annotation_type: polygon
    cvat_color: "#FFE066"
    dataset_support: "96.3%"
    annotate_on: all_images
  - prototype_id: 4
    name: living_room
    group: rooms
    production_id: 7
    annotation_type: polygon
    cvat_color: "#66CCFF"
    dataset_support: "96.3%"
    annotate_on: all_images
  - prototype_id: 5
    name: kitchen
    group: rooms
    production_id: 9
    annotation_type: polygon
    cvat_color: "#FF9999"
    dataset_support: "96.3%"
    annotate_on: all_images
  - prototype_id: 6
    name: bathroom
    group: rooms
    production_id: 10
    annotation_type: polygon
    cvat_color: "#66CCCC"
    dataset_support: "96.3%"
    annotate_on: all_images
  - prototype_id: 7
    name: bed
    group: furniture
    production_id: 15
    annotation_type: bounding_box
    cvat_color: "#8B4513"
    dataset_support: "24.8%"
    annotate_on: furnished_images_only
  - prototype_id: 8
    name: wc
    group: fixtures
    production_id: 27
    annotation_type: bounding_box
    cvat_color: "#E0E0E0"
    dataset_support: "24.8%"
    annotate_on: furnished_images_only
  - prototype_id: 9
    name: sink
    group: fixtures
    production_id: 31
    annotation_type: bounding_box
    cvat_color: "#5F9EA0"
    dataset_support: "24.8%"
    annotate_on: furnished_images_only
  - prototype_id: 10
    name: stove
    group: appliances
    production_id: 32
    annotation_type: bounding_box
    cvat_color: "#FF4500"
    dataset_support: "23.3%"
    annotate_on: furnished_images_only

# Label export layout (documented — create at annotation time)
export:
  segmentation:
    format: YOLO 1.1 seg
    classes: [wall, door, window, bedroom, living_room, kitchen, bathroom]
    prototype_ids: [0, 1, 2, 3, 4, 5, 6]
    output_dir: labels/seg/train  # and labels/seg/val
  detection:
    format: YOLO detect
    classes: [bed, wc, sink, stove]
    prototype_ids: [7, 8, 9, 10]
    output_dir: labels/det/train  # and labels/det/val

training_note: >
  Prototype uses mixed annotation types. Train YOLO11n-seg on polygon classes
  and YOLO11n-detect on symbol classes, or a two-stage pipeline. Do not train
  until labels are exported per docs/PROTOTYPE_11_CLASS_PLAN.md.
