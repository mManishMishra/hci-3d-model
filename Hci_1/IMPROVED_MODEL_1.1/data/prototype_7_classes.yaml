# IMPROVED_MODEL_1 — Active 7-class YOLO11 segmentation training config
# LOCKED prototype IDs 0–6 (do not use 3-class or 11-class configs for training)

schema_version: "2.0"
phase: prototype_7
task: segmentation

nc: 7

path: D:/HCI_interor/IMPROVED_MODEL_1/data/prototype_7_batch
train: images/train
val: images/val

names:
  0: wall
  1: door
  2: window
  3: bedroom
  4: living_room
  5: kitchen
  6: bathroom

# Map to production taxonomy in data/classes.yaml (for future scale-up only)
production_id_map:
  0: 0    # wall
  1: 1    # door
  2: 2    # window
  3: 5    # bedroom
  4: 7    # living_room
  5: 9    # kitchen
  6: 10   # bathroom

groups:
  structural:
    ids: [0, 1, 2]
    annotation_type: polygon
  rooms:
    ids: [3, 4, 5, 6]
    annotation_type: polygon

cvat:
  project_name: IMPROVED_MODEL_1_7Class_Seg
  labels:
    wall: "#FF0000"
    door: "#00CC00"
    window: "#0066FF"
    bedroom: "#FFE066"
    living_room: "#66CCFF"
    kitchen: "#FF9999"
    bathroom: "#66CCCC"

export:
  format: YOLO 1.1 segmentation
  output_dirs:
    train: labels/train
    val: labels/val

training:
  model: yolo11n-seg.pt
  imgsz: 1024
  epochs: 50
  batch: 4
  patience: 15
