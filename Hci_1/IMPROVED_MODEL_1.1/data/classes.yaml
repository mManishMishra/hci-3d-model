# IMPROVED_MODEL_1 — BIM-oriented YOLO segmentation taxonomy
# 37 classes | YOLO IDs 0–36
# Regenerate frequencies: python scripts/analyze_class_taxonomy.py

schema_version: "1.0"
task: segment
nc: 37

# Active training subset — LOCKED 7-class segmentation (prototype IDs 0–6)
