[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "improved-model-1"
version = "0.2.0"
description = "YOLO11 7-class floor-plan segmentation training pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.0",
    "opencv-python-headless>=4.8,<5.0",
    "pillow>=10.0",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["_deferred*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
